name: Bug Report
description: Report a bug in DragyDash ESP32 (using redacted logs only)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please **never** post raw BLE captures, route traces, full `DRG70-xxxxxx` serial suffixes, or unredacted serial logs identifying your device.
  - type: input
    id: hardware
    attributes:
      label: Board Revision & Dragy Hardware
      placeholder: "e.g., LilyGO T-Display-S3 (non-touch), Dragy Pro (DRG70-******)"
    validations:
      required: true
  - type: dropdown
    id: variant
    attributes:
      label: Firmware Variant
      options:
        - Metric (lilygo_t_display_s3)
        - Imperial (lilygo_t_display_s3_imperial)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe observed display state, behavior, and reproduction steps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted Serial Monitor Output (optional)
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Check
      options:
        - label: I confirmed this report contains no full Dragy serial suffixes, raw BLE captures, or route data.
          required: true
