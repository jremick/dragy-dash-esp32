name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-native:
    name: Native C++ unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO Core
        run: python3 -m pip install --upgrade platformio

      - name: Run dragy_core unit tests
        run: pio test -e native -v

  build:
    name: Firmware build (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: lilygo_t_display_s3
            label: Metric km/h
          - env: lilygo_t_display_s3_imperial
            label: Imperial mph

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO Core
        run: python3 -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

  summary:
    name: PlatformIO build
    runs-on: ubuntu-latest
    needs: [test-native, build]

    steps:
      - name: All native tests and firmware variants passed
        run: echo "PlatformIO native tests and Metric/Imperial builds succeeded."
