name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-latest
          - language: actions
            build-mode: none
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Swift toolchain
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build dragy_core C++ library for CodeQL analysis
        if: matrix.language == 'c-cpp'
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ilib/dragy_core/include \
            -c lib/dragy_core/src/*.cpp
          rm -f ./*.o

      - name: Compile README image helper without running it
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          xcrun swiftc tools/generate_readme_assets.swift \
            -o "$RUNNER_TEMP/dragydash-readme-helper"

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:${{ matrix.language }}
