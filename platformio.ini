[platformio]
default_envs = lilygo_t_display_s3

[esp32_base]
platform = espressif32@8.0.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  h2zero/NimBLE-Arduino@^2.5.2
build_unflags =
  -DCORE_DEBUG_LEVEL
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DUSER_SETUP_LOADED=1
  -include include/TFT_eSPI_Setup.h

[env:lilygo_t_display_s3]
extends = esp32_base

[env:lilygo_t_display_s3_imperial]
extends = esp32_base
build_flags =
  ${esp32_base.build_flags}
  -DDRAGY_UNITS_IMPERIAL=1

[env:native]
platform = native
lib_compat_mode = off
test_framework = unity
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Werror
